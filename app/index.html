<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapCheck: report a water problem</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><strong>TapCheck</strong><a href="/">Report</a><a href="/map.html">Map</a><a href="/dashboard.html">Status</a></header>
  <main>
    <p class="disclaimer">This is not a substitute for official water testing. For emergencies, contact your local authority.</p>
    <form id="report">
      <label for="issue_type">What is the problem?</label>
      <select id="issue_type" required>
        <option value="discoloration">Discolored water</option>
        <option value="odor">Bad smell or taste</option>
        <option value="outage">No water</option>
        <option value="broken_infrastructure">Broken tap, pipe or standpipe</option>
        <option value="sanitation_gap">Sanitation problem</option>
        <option value="other">Other</option>
      </select>

      <fieldset><legend>How bad is it?</legend>
        <label class="inline"><input type="radio" name="severity" value="1"> Minor</label>
        <label class="inline"><input type="radio" name="severity" value="2" checked> Moderate</label>
        <label class="inline"><input type="radio" name="severity" value="3"> Severe</label>
      </fieldset>

      <fieldset><legend>How long has it lasted?</legend>
        <label class="inline"><input type="radio" name="duration" value="today" checked> Today</label>
        <label class="inline"><input type="radio" name="duration" value="few_days"> A few days</label>
        <label class="inline"><input type="radio" name="duration" value="week_plus"> A week or more</label>
      </fieldset>

      <fieldset><legend>Can you use the water right now?</legend>
        <label class="inline"><input type="radio" name="water_usable" value="yes"> Yes</label>
        <label class="inline"><input type="radio" name="water_usable" value="no"> No</label>
        <label class="inline"><input type="radio" name="water_usable" value="unsure" checked> Not sure</label>
      </fieldset>

      <label>Where?</label>
      <button type="button" class="secondary" id="locate">Use my location</button>
      <p class="hint">Or tap the map to drop a pin.</p>
      <div id="pickmap"></div>
      <p id="where" aria-live="polite">No location yet.</p>

      <label for="photo">Photo (optional)</label>
      <input id="photo" type="file" accept="image/*">
      <img id="preview" alt="Photo preview" hidden>

      <label for="description">Details (optional, 280 characters)</label>
      <textarea id="description" maxlength="280" rows="3"></textarea>

      <label for="contact_email">Email for follow-up (optional, never shown publicly)</label>
      <input id="contact_email" type="email" autocomplete="email">

      <button type="submit">Send report</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/queue.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const radio = (name) => document.querySelector(`input[name="${name}"]:checked`).value;
    let coords = null, photo = null, pin = null, pickmap = null;

    function setLocation(lat, lng, label) {
      coords = { lat, lng };
      $('where').textContent = label;
      if (!pickmap) return;
      pin ? pin.setLatLng([lat, lng]) : (pin = L.marker([lat, lng]).addTo(pickmap));
      pickmap.setView([lat, lng], Math.max(pickmap.getZoom(), 16));
    }

    if (window.L) {
      pickmap = L.map('pickmap').setView([37.8716, -122.2727], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(pickmap);
      pickmap.on('click', (e) => setLocation(e.latlng.lat, e.latlng.lng, 'Pin dropped on the map.'));
    } else {
      $('pickmap').hidden = true;
    }

    $('locate').onclick = () =>
      navigator.geolocation.getCurrentPosition(
        (p) => setLocation(p.coords.latitude, p.coords.longitude, 'Location captured.'),
        () => { $('where').textContent = 'Could not get your location. Allow location access, or tap the map.'; },
        { enableHighAccuracy: true, timeout: 10000 },
      );

    // Re-encoding through a canvas drops EXIF/GPS metadata and keeps photos around 100–300 KB.
    $('photo').onchange = async (e) => {
      const file = e.target.files[0];
      photo = null; $('preview').hidden = true;
      if (!file) return;
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
        const canvas = Object.assign(document.createElement('canvas'), { width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale) });
        canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        photo = canvas.toDataURL('image/jpeg', 0.7);
        Object.assign($('preview'), { src: photo, hidden: false });
      } catch {
        $('status').textContent = 'That photo could not be read. Try another one or send without a photo.';
      }
    };

    $('report').onsubmit = async (e) => {
      e.preventDefault();
      if (!coords) { $('status').textContent = 'Add your location first: use your location or tap the map.'; return; }
      const saved = TapQueue.add({
        id: crypto.randomUUID(), issue_type: $('issue_type').value, severity: Number(radio('severity')), duration: radio('duration'),
        water_usable: radio('water_usable'), description: $('description').value, contact_email: $('contact_email').value, photo, ...coords,
      });
      const { offline, limited, remaining } = await TapQueue.flush();
      $('status').textContent =
        limited ? 'You reached today\'s report limit. Your report is saved and will send automatically tomorrow.'
        : offline ? `Saved on this device${saved.photoDropped ? ' without the photo (storage is full)' : ''}. It will send when you are back online.`
        : remaining === 1 ? 'Report sent. Thank you. You can send 1 more report today.'
        : 'Report sent. Thank you.';
      e.target.reset(); coords = null; photo = null; $('preview').hidden = true; $('where').textContent = 'No location yet.';
      if (pin) { pin.remove(); pin = null; }
    };

    TapQueue.flush();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
