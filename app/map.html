<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapCheck: report map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><strong>TapCheck</strong><a href="/">Report</a><a href="/map.html">Map</a><a href="/dashboard.html">Status</a><a href="/api/export.csv">CSV</a><a href="/api/export.geojson">GeoJSON</a></header>
  <div class="filters">
    <label for="type" class="sr-only">Issue type</label>
    <select id="type"><option value="">All types</option><option value="discoloration">Discolored</option><option value="odor">Smell or taste</option><option value="outage">No water</option><option value="broken_infrastructure">Broken infrastructure</option><option value="sanitation_gap">Sanitation</option><option value="other">Other</option></select>
    <label for="age" class="sr-only">Age</label>
    <select id="age"><option value="1">Last 24 h</option><option value="7" selected>Last 7 days</option><option value="">All</option></select>
    <span class="legend"><i style="background:#DC2626"></i>Open <i style="background:#D97706"></i>Verified <i style="background:#2563EB"></i>Forwarded <i style="background:#16A34A"></i>Resolved</span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const COLORS = { open: '#DC2626', verified: '#D97706', forwarded: '#2563EB', resolved: '#16A34A' };
    const LABELS = { 1: 'Minor', 2: 'Moderate', 3: 'Severe' };
    const map = L.map('map').setView([37.8716, -122.2727], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    const layer = (L.markerClusterGroup ? L.markerClusterGroup() : L.layerGroup()).addTo(map);
    let reports = [];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function render() {
      const type = document.getElementById('type').value;
      const days = Number(document.getElementById('age').value);
      layer.clearLayers();
      reports
        .filter((r) => !type || r.issue_type === type)
        .filter((r) => !days || Date.now() - new Date(r.created_at) < days * 864e5)
        .forEach((r) =>
          L.circleMarker([r.public_lat, r.public_lng], { radius: 9, color: COLORS[r.status], fillOpacity: 0.6 })
            .bindPopup(`<b>${esc(r.issue_type.replace('_', ' '))}</b> · ${esc(r.status)} · ${LABELS[r.severity]}<br>
              ${r.has_photo ? `<img class="thumb" src="/photos/${esc(r.id)}.jpg" alt="Reported photo" loading="lazy"><br>` : ''}
              ${esc(r.description)}<br><small>${new Date(r.created_at).toLocaleString()}</small><br>
              <small>Approximate location (about 100 m). Not an official water test.</small>`)
            .addTo(layer),
        );
    }

    document.getElementById('type').onchange = render;
    document.getElementById('age').onchange = render;
    fetch('/api/reports').then((r) => r.json()).then((data) => { reports = data; render(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
